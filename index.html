<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Gamepad Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>

    <div class="container">
        <header class="brand-header">
            <div class="brand-wrap">
                <span class="brand-mark" aria-hidden="true">G</span>
                <h1 class="company-name">Ghost Gateway Co.</h1>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle day/night">
                <span class="toggle-icon">🌙</span>
                <span class="toggle-label">Night</span>
            </button>
        </header>

        <main class="portal-box">
            <div class="panel-topline">
                <span class="status-dot" aria-hidden="true"></span>
                <span>Portal Active</span>
            </div>
            <h2>Select a Simulation</h2>
            <div class="button-grid">
                <button class="play-btn" data-url="https://azgames.io">
                    <span>A-Z</span>
                    <small>Arcade</small>
                </button>

                <button class="play-btn" data-url="https://kahoot.si">
                    <span>Kiwi</span>
                    <small>Quick Play</small>
                </button>

                <button class="play-btn" data-url="https://gulper.io">
                    <span>Gulper.io</span>
                    <small>Challenge</small>
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
