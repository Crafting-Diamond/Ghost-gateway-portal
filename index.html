<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Gamepad Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header class="brand-header">
            <div class="brand-wrap">
                <span class="brand-mark">G</span>
                <h1 class="company-name">Ghost Gateway Co.</h1>
            </div>

            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle day/night" aria-pressed="false">
                <span class="toggle-icon">🌙</span>
                <span class="toggle-label">Night</span>
            </button>
        </header>

        <main class="portal-box">
            <h2>Select a Simulation</h2>
            <div class="button-grid">
                <button class="play-btn" onclick="launchGame('https://azgames.io')">A-Z</button>
                <button class="play-btn" onclick="launchGame('https://kahoot.si')">Kiwi</button>
                <button class="play-btn" onclick="launchGame('https://gulper.io')">Gulper.io</button>
            </div>
        </main>
    </div>

    <script src="theme-toggle.js"></script>
    <script src="script.js"></script>
</body>
</html>
